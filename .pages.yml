# Configuração do Pages CMS – https://pagescms.org
# Os gestores editam o conteúdo em https://app.pagescms.org (ficheiros em /data e imagens/PDF em /media)
media:
  input: media
  output: media
content:
- name: site
  label: Definições do site
  type: file
  path: data/site.json
  format: json
  fields:
  - name: nome
    label: Nome da aplicação (topo)
    type: string
  - name: subtitulo
    label: Subtítulo (topo)
    type: string
  - name: etiqueta
    label: Etiqueta da página inicial
    type: string
  - name: titulo
    label: Título da página inicial
    type: string
  - name: boasvindas
    label: Texto de boas-vindas
    type: text
  - name: rodape
    label: Rodapé
    type: string
- name: informacoes-gerais
  label: Informações Gerais (menu do topo)
  type: file
  path: data/informacoes-gerais.json
  format: json
  fields:
  - name: itens
    label: Páginas do menu
    type: object
    list: true
    fields:
    - name: titulo
      label: Título
      type: string
      required: true
    - name: slug
      label: Endereço curto (sem espaços nem acentos; opcional)
      type: string
    - name: resumo
      label: Resumo
      type: string
    - name: conteudo
      label: Conteúdo
      type: rich-text
      options:
        format: markdown
    - name: ligacoes
      label: Ligações e documentos
      type: object
      list: true
      fields:
      - name: texto
        label: Texto a mostrar
        type: string
      - name: url
        label: Ligação externa (https://…)
        type: string
      - name: ficheiro
        label: Ou ficheiro carregado
        type: file
- name: cirurgia-geral
  label: Cirurgia Geral
  type: file
  path: data/cirurgia-geral.json
  format: json
  fields: &id001
  - name: titulo
    label: Título
    type: string
    required: true
  - name: resumo
    label: Resumo (aparece no cartão da página inicial)
    type: string
  - name: seccoes
    label: Secções
    type: object
    list: true
    fields:
    - name: titulo
      label: Título da secção
      type: string
    - name: imagem
      label: Imagem (opcional)
      type: image
    - name: conteudo
      label: Conteúdo
      type: rich-text
      options:
        format: markdown
  - name: ligacoes
    label: Ligações e documentos
    type: object
    list: true
    fields:
    - name: texto
      label: Texto a mostrar
      type: string
    - name: url
      label: Ligação externa (https://…)
      type: string
    - name: ficheiro
      label: Ou ficheiro carregado
      type: file
- name: mgf
  label: MGF
  type: file
  path: data/mgf.json
  format: json
  fields: *id001
- name: medicina-interna
  label: Medicina Interna
  type: file
  path: data/medicina-interna.json
  format: json
  fields: *id001
- name: pediatria
  label: Pediatria
  type: file
  path: data/pediatria.json
  format: json
  fields: *id001
- name: recursos-humanos
  label: Recursos Humanos
  type: file
  path: data/recursos-humanos.json
  format: json
  fields: *id001
- name: medicina-do-trabalho
  label: Medicina do Trabalho
  type: file
  path: data/medicina-do-trabalho.json
  format: json
  fields: *id001
